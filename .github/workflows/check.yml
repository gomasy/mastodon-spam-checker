name: Check

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --all-targets so the tests are linted too; they are exempt from the
      # unwrap/expect gate through clippy.toml rather than by going unchecked.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: cargo test --locked
