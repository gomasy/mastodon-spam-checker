[package]
name = "mastodon-spam-checker"
version = "0.5.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
dotenvy = "0.15.7"
redis = { version = "1.5.0", default-features = false, features = ["connection-manager", "script", "tokio-comp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "http2", "rustls-no-provider"] }
ring = "0.17.14"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
rust-i18n = "4.2.1"
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints.clippy]
# No request may be able to take the process down — the release profile aborts
# on panic, so an unwrap in a handler takes the whole checker with it. Nothing
# outside the tests unwraps today; denying it is what keeps that true as the
# code grows, and the `check` workflow runs clippy with -D warnings so it is
# enforced on every push. Tests are exempt via clippy.toml — there, a panic is
# how a failure is reported.
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
strip = true
panic = "abort"
opt-level = "z"
codegen-units = 1
